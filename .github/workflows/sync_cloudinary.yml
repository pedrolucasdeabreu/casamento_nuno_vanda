name: Sync Cloudinary Gallery

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *' # a cada X minutos

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch Cloudinary images
        env:
          CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          set -e
          # fetch images and videos from Cloudinary into temp files
          curl -s -u "$API_KEY:$API_SECRET" \
            "https://api.cloudinary.com/v1_1/$CLOUD_NAME/resources/image/upload?max_results=500&prefix=casamento_nuno_vanda" \
            -o /tmp/images.json
          curl -s -u "$API_KEY:$API_SECRET" \
            "https://api.cloudinary.com/v1_1/$CLOUD_NAME/resources/video/upload?max_results=500&prefix=casamento_nuno_vanda" \
            -o /tmp/videos.json || true
          [ -s /tmp/images.json ] || echo '{}' > /tmp/images.json
          [ -s /tmp/videos.json ] || echo '{}' > /tmp/videos.json

          # generate the new gallery into a temp file first
          jq -s '
            def extract:
              if type == "object" then (.resources // [])
              elif type == "array" then .
              else []
              end;
            [.[0], .[1]]
            | map(extract)
            | flatten
            | map(select(type == "object" and .secure_url != null))
            | sort_by(.created_at // "")
            | reverse
            | map({
                url: .secure_url,
                public_id: .public_id,
                format: .format,
                resource_type: .resource_type,
                width: .width,
                height: .height,
                created_at: .created_at,
                contributor: (.context.contributor // null)
              })
          ' /tmp/images.json /tmp/videos.json > /tmp/new_gallery.json

          # guard against empty or malformed output; otherwise we would end up with an empty JSON file and break the gallery
          if ! jq -e 'type == "array"' /tmp/new_gallery.json >/dev/null 2>&1; then
            echo '[]' > /tmp/new_gallery.json
          fi

          # compute counts: new vs existing (in repo)
          new_count=$(jq 'length' /tmp/new_gallery.json || echo 0)
          if [ -f data/gallery.json ]; then
            old_count=$(jq 'length' data/gallery.json || echo 0)
          else
            old_count=0
          fi

          echo "New gallery count: $new_count"
          echo "Existing gallery count: $old_count"

          # if new count is less than existing, explicitly replace (truncate) the repository file
          # otherwise just overwrite with generated file (both cases we write the new file)
          if [ "$new_count" -lt "$old_count" ]; then
            echo "New count is smaller than existing; truncating data/gallery.json to $new_count entries"
          fi

          # move the new gallery into the repo path (this overwrites and ensures the file matches the new results)
          mkdir -p data
          mv /tmp/new_gallery.json data/gallery.json

      - name: Commit data/gallery.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gallery.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update gallery.json from Cloudinary"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
          fi